<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">JIRASSIC mobile project incident card</title>
  <desc id="desc">Signal: Standups ended. Action items evaporated.. System: Whisper → Gemini → story-pointed Jira tasks. Result: 2nd Prize Hack@Davidson 2025.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2B333D"/></pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect width="720" height="520" rx="22" fill="#10151A"/>
  <rect width="720" height="520" rx="22" fill="url(#dots)"/>
  <rect x="1" y="1" width="718" height="518" rx="21" fill="none" stroke="#303945" stroke-width="2"/>
  <rect width="720" height="124" rx="22" fill="#E7B557"/>
  <rect y="100" width="720" height="24" fill="#E7B557"/>
  <text x="28" y="36" class="mono" font-size="12" font-weight="700" letter-spacing="2" fill="#17120F">INCIDENT 02 / MEETINGS → WORK</text>
  <text x="28" y="88" class="sans" font-size="32" font-weight="900" fill="#17120F">JIRASSIC</text>
  <rect x="536" y="42" width="152" height="48" rx="11" fill="#17120F"/>
  <text x="560" y="72" class="mono" font-size="13" font-weight="700" fill="#FFF4E7">OPEN REPO ↗</text>

  <text x="32" y="166" class="mono" font-size="16" font-weight="700" letter-spacing="2" fill="#E7B557">SIGNAL</text>
  <text x="32" y="204" class="sans" font-size="27" font-weight="700" fill="#FFF4E7">Standups ended. Action items evaporated.</text>
  <line x1="32" y1="234" x2="688" y2="234" stroke="#303945"/>

  <text x="32" y="278" class="mono" font-size="16" font-weight="700" letter-spacing="2" fill="#E7B557">SYSTEM</text>
  <text x="32" y="316" class="sans" font-size="27" font-weight="700" fill="#FFF4E7">Whisper → Gemini</text>
  <text x="32" y="350" class="sans" font-size="27" font-weight="700" fill="#FFF4E7">→ story-pointed Jira tasks</text>
  <line x1="32" y1="378" x2="688" y2="378" stroke="#303945"/>

  <text x="32" y="422" class="mono" font-size="16" font-weight="700" letter-spacing="2" fill="#E7B557">RESULT</text>
  <text x="32" y="460" class="sans" font-size="27" font-weight="800" fill="#FFF4E7">2nd Prize · Hack@Davidson 2025</text>
  <circle cx="32" cy="494" r="5" fill="#48D597"/>
  <text x="47" y="499" class="mono" font-size="12" font-weight="700" fill="#A6B0BB">SYSTEM DOCUMENTED</text>
</svg>
